$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aster-team.local/contracts/error-response.v1.schema.json
title: Aster Team public API error envelope
type: object
additionalProperties: false
required: [error]
properties:
  error:
    type: object
    additionalProperties: false
    required: [code, number, message]
    properties:
      code:
        type: string
        pattern: '^[A-Z][A-Z0-9_]+$'
      number:
        type: integer
        minimum: 10000
        maximum: 99999
      message:
        type: string
        minLength: 1
