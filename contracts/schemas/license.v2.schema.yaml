$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aster-team.local/contracts/license.v2.schema.json
title: Aster signed unified license v2
description: Wire structure only. Trusted signature, issuer scope, semantic
  time/version checks and runtime policy are also required.
$ref: "#/$defs/document"
$defs:
  document:
    type: object
    additionalProperties: false
    required: [ claims, signature ]
    properties:
      claims: { $ref: "#/$defs/claims" }
      signature: { type: string, pattern: "^[A-Za-z0-9_-]{86}$" }
  identifier:
    type: string
    pattern: ^[A-Za-z0-9._:@+/-]{1,128}$
  exact_time:
    type: string
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-5][0-9]\.[0-9]{3}Z$
  free_source:
    type: object
    additionalProperties: false
    required:
      - kind
      - distribution_id
    properties:
      kind:
        const: free_distribution
      distribution_id:
        $ref: "#/$defs/identifier"
  order_source:
    type: object
    additionalProperties: false
    required:
      - kind
      - order_id
      - customer_ref
      - request_id
    properties:
      kind:
        const: commercial_order
      order_id:
        $ref: "#/$defs/identifier"
      customer_ref:
        $ref: "#/$defs/identifier"
      request_id:
        $ref: "#/$defs/identifier"
  trial_source:
    type: object
    additionalProperties: false
    required:
      - kind
      - trial_id
      - customer_ref
      - request_id
    properties:
      kind:
        const: approved_trial
      trial_id:
        $ref: "#/$defs/identifier"
      customer_ref:
        $ref: "#/$defs/identifier"
      request_id:
        $ref: "#/$defs/identifier"
  unbound:
    type: object
    additionalProperties: false
    required:
      - mode
    properties:
      mode:
        const: unbound
  installation:
    type: object
    additionalProperties: false
    required:
      - mode
      - installation_id
      - machine_fingerprint_sha256
      - transfer_sequence
    properties:
      mode:
        const: installation
      installation_id:
        type: string
        pattern: ^[A-Za-z0-9._:@+/-]{8,128}$
      machine_fingerprint_sha256:
        type: string
        pattern: ^[A-Za-z0-9_-]{43}$
      transfer_sequence:
        type: integer
        minimum: 0
        maximum: 10000
  fixed_expiry:
    type: object
    additionalProperties: false
    required:
      - mode
      - expires_at
    properties:
      mode:
        const: fixed
      expires_at:
        $ref: "#/$defs/exact_time"
  no_expiry:
    type: object
    additionalProperties: false
    required:
      - mode
    properties:
      mode:
        const: none
  validity:
    type: object
    additionalProperties: false
    required:
      - not_before
      - expiry
    properties:
      not_before:
        $ref: "#/$defs/exact_time"
      expiry:
        oneOf:
          - $ref: "#/$defs/fixed_expiry"
          - $ref: "#/$defs/no_expiry"
  claims:
    type: object
    additionalProperties: false
    required:
      - schema
      - key_id
      - license_id
      - serial
      - product
      - edition
      - plan_id
      - plan_version
      - source
      - entitlements
      - quota_policy_version
      - binding
      - validity
      - issued_at
      - minimum_version
    properties:
      schema:
        const: aster.license.v2
      key_id:
        $ref: "#/$defs/identifier"
      license_id:
        $ref: "#/$defs/identifier"
      serial:
        $ref: "#/$defs/identifier"
      product:
        const: aster-team
      edition:
        $ref: "#/$defs/identifier"
      plan_id:
        $ref: "#/$defs/identifier"
      plan_version:
        type: integer
        minimum: 1
        maximum: 4294967295
      source:
        oneOf:
          - $ref: "#/$defs/free_source"
          - $ref: "#/$defs/order_source"
          - $ref: "#/$defs/trial_source"
      entitlements:
        $ref: ./entitlements.v1.schema.yaml#/$defs/entitlement_payload
      quota_policy_version:
        const: 1
      binding:
        oneOf:
          - $ref: "#/$defs/unbound"
          - $ref: "#/$defs/installation"
      validity:
        $ref: "#/$defs/validity"
      issued_at:
        $ref: "#/$defs/exact_time"
      minimum_version:
        type: string
        maxLength: 64
        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$
    allOf:
      - if:
          type: object
          required:
            - source
          properties:
            source:
              type: object
              required:
                - kind
              properties:
                kind:
                  const: free_distribution
        then:
          properties:
            binding:
              $ref: "#/$defs/unbound"
        else:
          properties:
            binding:
              $ref: "#/$defs/installation"
            validity:
              type: object
              additionalProperties: false
              required:
                - not_before
                - expiry
              properties:
                not_before:
                  $ref: "#/$defs/exact_time"
                expiry:
                  $ref: "#/$defs/fixed_expiry"
      - if:
          required:
            - source
          properties:
            source:
              type: object
              required:
                - kind
              properties:
                kind:
                  enum:
                    - free_distribution
                    - approved_trial
        then:
          properties:
            entitlements:
              type: object
              properties:
                feature_sets:
                  type: array
                  maxItems: 0
