components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: aster_operations_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    LicenseID:
      name: licenseID
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
    CustomerID:
      name: customerID
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 64 }
    OrderID:
      name: orderID
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 64 }
    PlanID:
      name: planID
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 64 }
    TrialID:
      name: trialID
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 64 }
    ListLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PaidFulfillmentRecord:
      oneOf:
        - $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/record
        - $ref: ../schemas/paid-lifecycle.v1.schema.yaml#/$defs/record
    PaidFulfillmentContext:
      $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/context
    PaidLifecycleSource:
      $ref: ../schemas/paid-lifecycle.v1.schema.yaml#/$defs/source
    ApprovePaidFulfillmentInput:
      $ref: ../schemas/paid-lifecycle.v1.schema.yaml#/$defs/approval
    RecordPaidRedeliveryInput:
      $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/redelivery_request
    PaidRedeliveryRecord:
      $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/redelivery_record
    ApprovePaidTransferInput:
      $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/transfer_request
    PaidTransferRecord:
      $ref: ../schemas/paid-fulfillment.v1.schema.yaml#/$defs/transfer_record
    CommercialPaymentRecord:
      $ref: ../schemas/payment.v1.schema.yaml#/$defs/record
    CommercialPaymentContext:
      $ref: ../schemas/payment.v1.schema.yaml#/$defs/context
    ConfirmCommercialPaymentInput:
      $ref: ../schemas/payment.v1.schema.yaml#/$defs/confirmation
    FreeDistributionRecord:
      $ref: ../schemas/free-distribution.v1.schema.yaml#/$defs/record
    ApproveFreeDistributionInput:
      $ref: ../schemas/free-distribution.v1.schema.yaml#/$defs/approval_input
    IssueFreeDistributionInput:
      type: object
      additionalProperties: false
      required:
        - key_id
        - current_password
      properties:
        key_id:
          $ref: ../schemas/license.v2.schema.yaml#/$defs/identifier
        current_password:
          type: string
          minLength: 1
          writeOnly: true
    V2IssuerProfile:
      $ref: ../schemas/free-distribution.v1.schema.yaml#/$defs/issuer_profile
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Operator:
      type: object
      additionalProperties: false
      required: [id, email, display_name, status, password_change_required, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        status: { type: string, enum: [active, disabled] }
        password_change_required: { type: boolean }
        created_at: { type: string, format: date-time }
    SessionResponse:
      type: object
      additionalProperties: false
      required: [operator, expires_at]
      properties:
        operator:
          $ref: '#/components/schemas/Operator'
        expires_at: { type: string, format: date-time }
    CustomerInput:
      type: object
      additionalProperties: false
      required: [name, legal_name, status, contact_name, contact_email, contact_phone, contact_wechat, notes]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        legal_name: { type: string, maxLength: 200 }
        status: { type: string, enum: [lead, active, inactive] }
        contact_name: { type: string, maxLength: 120 }
        contact_email: { type: string, maxLength: 320 }
        contact_phone: { type: string, maxLength: 64 }
        contact_wechat: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 4000 }
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          additionalProperties: false
          required: [id, created_at, updated_at]
          properties:
