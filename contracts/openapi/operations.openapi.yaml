openapi: 3.1.0
info:
  title: Aster Operations API
  version: 0.1.0
servers:
  - url: /api/operations/v1
paths:
  /upgrade-environments:
    get:
      operationId: listUpgradeEnvironments
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeEnvironmentList"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createUpgradeEnvironment
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpgradeEnvironment"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpgradeEnvironmentInput"
  /upgrade-environments/{environmentID}/credentials:
    put:
      operationId: rotateUpgradeCredentials
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: environmentID
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpgradeCredentials' }
      responses:
        '204':
          description: Credentials rotated
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /upgrade-environments/{environmentID}/inspect:
    post:
      operationId: inspectUpgradeEnvironment
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetMaintenance"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      parameters:
        - in: path
          name: environmentID
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFToken"
  /environment-upgrades:
    get:
      operationId: listEnvironmentUpgrades
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentUpgradeList"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    post:
      operationId: createEnvironmentUpgrade
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentUpgrade"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentUpgradeInput"
  /environment-upgrades/{upgradeID}:
    get:
      operationId: getEnvironmentUpgrade
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Environment upgrade response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentUpgradeDetail"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      parameters:
        - in: path
          name: upgradeID
          required: true
          schema:
            type: string
        - in: query
          name: after
          schema:
            type: integer
            minimum: 0
  /commercial/publications/{publicationID}/failures:
    parameters:
      - { name: publicationID, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    get:
      operationId: listPublicationFailures
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Most recent 100 unsuccessful attempts; previous failures remain after acceptance
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicationFailure' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /commercial/publications:
    get:
      operationId: listPublications
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Publication reconciliation history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublicationRecord' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: preparePublication
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreparePublicationRequest' }
      responses:
        '201':
          description: Immutable candidate prepared; no deployment or acceptance performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /commercial/publications/{publicationID}:
    parameters:
      - { name: publicationID, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    get:
      operationId: getPublication
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Original publication record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /commercial/publications/{publicationID}/accept:
    parameters:
      - { name: publicationID, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
    post:
      operationId: verifyAndAcceptPublication
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password]
              properties:
                current_password: { type: string, minLength: 1, maxLength: 72 }
      responses:
        '200':
          description: Controlled target verified and acceptance committed, or original receipt recovered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationRecord' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /commercial/publication-heads/{environment}:
    parameters:
      - { name: environment, in: path, required: true, schema: { type: string, enum: [local, production] } }
    get:
      operationId: getPublicationHead
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Last verified and accepted publication for this environment
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [active_id]
                properties:
                  active_id: { type: string, maxLength: 64 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /session:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
    get:
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Error'
    delete:
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /overview:
    get:
      operationId: getOverview
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Operations overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Error'
  /session/password:
    put:
      operationId: changePassword
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 12, maxLength: 72 }
      responses:
        '204': { description: Password changed and other sessions revoked }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /customers:
    get:
      operationId: listCustomers
      security:
        - sessionCookie: []
      parameters:
        - name: after
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Customer page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: createCustomer
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /customers/{customerID}:
    get:
      operationId: getCustomerProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CustomerID' }]
      responses:
        '200': { description: Customer, contacts and billing profile, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerProfile' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCustomer
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CustomerID' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerInput' } } } }
      responses:
        '200': { description: Audited customer update, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /customers/{customerID}/contacts:
    post:
      operationId: createContact
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CustomerID' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } } }
      responses:
        '201': { description: Contact created, content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /customers/{customerID}/billing-profile:
    put:
      operationId: upsertBillingProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CustomerID' }, { $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BillingProfileInput' } } } }
      responses:
        '200': { description: Billing profile created or updated, content: { application/json: { schema: { $ref: '#/components/schemas/BillingProfile' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /backup-history:
    get:
      operationId: listBackupHistory
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ListLimit' }]
      responses:
        '200': { description: Backup and verification history, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BackupRecord' } } } } } } }
  /exports:
    post:
      operationId: exportOperations
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [current_password], properties: { current_password: { type: string, format: password } } } } }
      responses:
        '200': { description: Redacted local business export without credentials or signing secrets, content: { application/json: { schema: { $ref: '#/components/schemas/OperationsExport' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /audit-events:
    get:
      operationId: listAuditEvents
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ListLimit' }]
      responses:
        '200':
          description: Append-only local audit events
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } } } } }
  /release-artifacts:
    get:
      operationId: listReleaseArtifacts
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ListLimit' }]
      responses:
        '200': { description: Immutable release artifact list, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleaseArtifact' } } } } } } }
    post:
      operationId: importReleaseArtifact
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseArtifactInput' } } } }
      responses:
        '201': { description: Release imported from the controlled inbox after SHA-256 verification, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseArtifact' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /release-tasks:
    get:
      operationId: listReleaseTasks
      description: Requires the release.read permission. Returns persisted release orchestration tasks; it never infers state from log text.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ListLimit' }]
      responses:
        '200': { description: Release task list, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleaseTask' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createReleaseTask
      description: Requires release.build. Runs fixed preflight checks and dispatches the server-configured no-tag customer release workflow.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskInput' } } } }
      responses:
        '201': { description: Release task created and bound to its GitHub workflow run, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /release-artifacts/{artifactID}/download:
    get:
      operationId: downloadReleaseArtifact
      description: Requires release.download. Streams the immutable Customer tar.gz after rechecking its content-addressed object hash.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: artifactID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Verified immutable Customer release archive
          headers:
            Content-Disposition: { description: 'Attachment filename derived from the selected package version, platform and architecture.', schema: { type: string } }
            Content-Length: { description: Original tar.gz archive size in bytes., schema: { type: integer, format: int64 } }
            ETag: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /release-tasks/{taskID}:
    get:
      operationId: getReleaseTask
      description: Requires the release.read permission. Returns the persisted task, runs, jobs, steps and artifact verification metadata.
      security: [{ sessionCookie: [] }]
      parameters:
        - name: taskID
          in: path
          required: true
          schema: { type: string, pattern: '^release_task_[A-Za-z0-9_.-]+$' }
      responses:
        '200': { description: Release task detail, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskDetail' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /release-tasks/{taskID}/sync:
    post:
      operationId: syncReleaseTask
      description: Requires release.build. Re-reads the bound GitHub Run, Jobs, Steps, sanitized failure excerpts and artifact metadata.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - name: taskID
          in: path
          required: true
          schema: { type: string, pattern: '^release_task_[A-Za-z0-9_.-]+$' }
      responses:
        '200': { description: Synchronized release task, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskDetail' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /release-tasks/{taskID}/retry:
    post:
      operationId: retryReleaseTask
      description: Requires release.build. Creates a new task from the same immutable version and source commit after repeating preflight checks.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - name: taskID
          in: path
          required: true
          schema: { type: string, pattern: '^release_task_[A-Za-z0-9_.-]+$' }
      responses:
        '201': { description: Retry task created, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskDetail' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /release-tasks/{taskID}/artifacts/{artifactID}/reverify:
    post:
      operationId: reverifyReleaseTask
      description: Requires release.build. Queues independent verification of the selected Linux or Windows package from a successful GitHub run. Other packages retain their status. The verifier reuses a content-addressed local cache when present, but always repeats the complete package, signature, manifest, checksum and runtime verification flow.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - name: taskID
          in: path
          required: true
          schema: { type: string, pattern: '^release_task_[A-Za-z0-9_.-]+$' }
        - name: artifactID
          in: path
          required: true
          schema: { type: string }
      responses:
        '202': { description: Artifact reverification queued on the existing release task, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseTaskDetail' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /release-capabilities:
    get:
      operationId: getReleaseCapabilities
      description: Returns only fixed, non-secret release-center configuration and whether GitHub App orchestration is configured.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Release center capabilities, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseCapabilities' } } } }
        '403': { $ref: '#/components/responses/Error' }
  /release-publish-requests:
    get:
      operationId: listReleasePublishRequests
      description: Requires release.read. Lists the append-only formal publish approval state.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/ListLimit' }]
      responses:
        '200': { description: Formal publish requests, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReleasePublishRequest' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
  /release-artifacts/{artifactID}/publish-requests:
    post:
      operationId: requestReleasePublish
      description: Requires release.publish.request. Creates an approval request for bytes already independently verified and stored by Operations.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - name: artifactID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '201': { description: Publish request created, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePublishRequest' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /release-publish-requests/{requestID}/decision:
    post:
      operationId: decideReleasePublish
      description: Requires release.publish.approve and reauthentication. The original requester is forbidden from deciding.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/CSRFToken' }
        - name: requestID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePublishDecisionInput' } } }
      responses:
        '200': { description: Publish request approved or rejected, content: { application/json: { schema: { $ref: '#/components/schemas/ReleasePublishRequest' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
