name: Install locked Node dependencies
description: Save the npm download cache immediately after a successful install.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22.19.0
        package-manager-cache: false
    - name: Locate npm download cache
      id: npm-path
      shell: bash
      run: node scripts/ci/npm-cache-path.mjs
    - name: Restore npm downloads
      id: npm-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.npm-path.outputs.path }}
        key: aster-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          aster-npm-v1-${{ runner.os }}-${{ runner.arch }}-node22-
    - name: Install locked dependencies
      shell: bash
      run: npm ci
    - name: Save populated npm downloads before builds and tests
      if: steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.npm-path.outputs.path }}
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
