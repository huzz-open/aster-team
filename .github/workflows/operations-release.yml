name: Release internal Operations suite

on:
  push:
    tags:
      - 'operations-v*'

permissions:
  contents: write

concurrency:
  group: operations-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Operations Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install-node-dependencies
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.14'
          cache: true
      - run: npm run verify:boundaries -- --domain=operations
      - run: go test ./operations/...
      - run: npm run typecheck --workspace @aster/operations-console
      - name: Build Operations bundle
        env:
          ASTER_OPERATIONS_RELEASE_VERSION: ${{ github.ref_name }}
        run: npm run build:operations -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operations-linux-${{ matrix.arch }}
          path: dist/operations/aster-operations-*-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  release:
    name: Publish internal Operations release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
