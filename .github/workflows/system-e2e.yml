name: System E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system-e2e:
    name: Clean install, authorization and API matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/install-node-dependencies
      - uses: ./.github/actions/prepare-ci-images
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.25.14'
          cache: true
      - name: Install Chromium and host dependencies
        run: npm run setup:delivery-tests -- --with-deps
      - name: Run the reproducible system journey
        run: npm run test:system-e2e
      - name: Prove two complete runs are isolated
        run: npm run test:system-e2e:parallel
      - name: Upload failed diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: system-e2e-${{ github.run_id }}
          path: target/system-e2e/runs/*/diagnostics
          if-no-files-found: ignore
          retention-days: 7
