name: Installation or upgrade / 安装与升级
description: Report installation, upgrade, restore, or startup problems / 反馈安装、升级、恢复或启动问题
title: "[Install] "
labels: [installation]
body:
  - type: markdown
    attributes:
      value: Do not upload installer passwords, licenses, keys, databases, or unredacted diagnostic bundles. 请勿上传安装密码、License、密钥、数据库或未脱敏诊断包。
  - type: input
    id: version
    attributes:
      label: Version and complete package filename / 版本与完整文件名
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: SHA-256 verification / 校验结果
      placeholder: Passed, or provide the actual digest / 通过，或填写实际摘要
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and CPU architecture / 操作系统与架构
      placeholder: For example / 例如 Ubuntu 22.04 x86-64
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Operation / 操作类型
      options:
        - First installation / 首次安装
        - Upgrade / 升级
        - Restore after uninstall / 卸载后恢复
        - Dedicated Runner installation / 独立 Runner 安装
        - License import / 许可证导入
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Commands and steps / 命令与步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Error number and redacted output / 错误编号与脱敏输出
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data confirmation / 敏感信息确认
      options:
        - label: I removed passwords, keys, licenses, cookies, database content, and other sensitive data. / 我已移除敏感信息。
          required: true
