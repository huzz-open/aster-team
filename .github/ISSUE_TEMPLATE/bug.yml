name: 软件问题
description: 报告可以稳定复现的 Aster Team 产品问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先移除密码、API Key、License、Cookie、数据库内容和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: Aster Team 版本
      placeholder: 例如 2.0.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 出现问题的组件
      options:
        - Control / 管理端
        - Member / 成员端
        - Runner
        - CLI
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从正常状态开始的完整操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以提供已脱敏的错误编号和必要日志片段
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与部署环境
      placeholder: 例如 Ubuntu 20.04 x86-64，Control 与 Runner 同机
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 敏感信息确认
      options:
        - label: 我已移除密码、Key、License、Cookie、数据库内容和其他敏感信息
          required: true
