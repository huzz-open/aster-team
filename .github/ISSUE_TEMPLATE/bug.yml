name: Bug report / 软件问题
description: Report a reproducible Aster Team product problem / 反馈可稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before submitting, remove passwords, API keys, licenses, cookies, database content, and other sensitive data. 提交前请移除密码、API Key、License、Cookie、数据库内容和其他敏感信息。
  - type: input
    id: version
    attributes:
      label: Aster Team version / 版本
      placeholder: For example / 例如 2.0.1
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component / 问题组件
      options:
        - Control / Admin UI
        - Member UI
        - Runner
        - CLI
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Start from a known-good state and list every action. 请从正常状态开始列出完整步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
      description: Include redacted error numbers and only the necessary log lines. 可提供已脱敏的错误编号和必要日志片段。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and deployment / 操作系统与部署
      placeholder: For example, Ubuntu 22.04 x86-64, Control and Runner on one host
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data confirmation / 敏感信息确认
      options:
        - label: I removed passwords, keys, licenses, cookies, database content, and other sensitive data. / 我已移除敏感信息。
          required: true
