[package]
name = "aster-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
default-run = "aster-control"

[[bin]]
name = "aster-control"
path = "src/main.rs"

[[bin]]
name = "seed_local_mock_usage"
path = "src/bin/seed_local_mock_usage.rs"
required-features = ["local-demo", "mariadb"]

[[bin]]
name = "license_browser_fixture"
path = "src/bin/license_browser_fixture.rs"
required-features = ["local-demo", "sqlite-dev"]

[features]
default = ["local-demo", "mariadb"]
local-demo = []
mariadb = ["aster-storage/mariadb"]
sqlcipher = ["aster-storage/sqlcipher"]
sqlite-dev = ["aster-storage/sqlite-dev"]

[dependencies]
aster-auth-core = { path = "../crates/auth-core" }
aster-claude-config = { path = "../crates/claude-config" }
aster-codex-config = { path = "../crates/codex-config" }
aster-credential-vault = { path = "../crates/credential-vault" }
aster-error-catalog = { path = "../crates/error-catalog" }
aster-install-layout = { path = "../crates/install-layout" }
aster-license-core = { path = "../../../packages/rust/license-core" }
aster-license-state = { path = "../crates/license-state" }
aster-machine-identity = { path = "../crates/machine-identity" }
aster-policy-core = { path = "../crates/policy-core" }
aster-plugin-core = { path = "../crates/plugin-core" }
aster-routing = { path = "../crates/routing" }
aster-release-core = { path = "../../../packages/rust/release-core" }
aster-runner-protocol = { path = "../crates/runner-protocol" }
aster-storage = { path = "../crates/storage", default-features = false }
aster-upgrade-core = { path = "../crates/upgrade-core" }
axum.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
rustls.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
flate2.workspace = true
http-body.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile = "3.27.0"
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process"] }

[build-dependencies]
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", features = ["full", "visit"] }
toml = "0.8.23"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[dev-dependencies]
proc-macro2 = "1.0.107"
syn = { version = "2.0.119", features = ["full", "visit"] }
toml = "0.8.23"
tokio = { workspace = true, features = ["test-util"] }
rcgen = "0.14.9"
rusqlite.workspace = true
time = { workspace = true, features = ["macros"] }
tokio-tungstenite.workspace = true
tower.workspace = true
