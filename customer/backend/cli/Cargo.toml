[package]
name = "aster-team-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
aster-error-catalog = { path = "../crates/error-catalog" }
aster-install-layout = { path = "../crates/install-layout" }
aster-license-core = { path = "../../../packages/rust/license-core" }
aster-release-core = { path = "../../../packages/rust/release-core" }
aster-upgrade-core = { path = "../crates/upgrade-core" }
base64.workspace = true
clap.workspace = true
getrandom.workspace = true
flate2.workspace = true
image = { version = "0.25.8", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
reqwest = { workspace = true, features = ["blocking"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
time.workspace = true
tar.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile = "3.27.0"

[build-dependencies]
time.workspace = true
